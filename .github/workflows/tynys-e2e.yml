name: tynys-e2e
# Запуск решения с нуля по README в окружении, близком к окружению судьи (Ubuntu 24.04).
permissions:
  contents: write
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Инструкция README
        run: |
          lscpu | grep '^CPU(s)'; free -g | head -2; docker --version; docker compose version
          start=$(date +%s)
          sudo apt-get install -y make
          make tynys
          echo "Время запуска по README: $(( $(date +%s) - start )) с"
      - name: What-if на стенде (включить → след в двойниках → отменить)
        run: python3 team/tynys/scripts/whatif_check.py
      - name: Скриншот экрана
        if: always()
        run: |
          pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
          python team/tynys/scripts/check3d.py http://127.0.0.1:8095/3d.html screen3d.png
          python team/tynys/scripts/screenshot.py http://127.0.0.1:8095 screen.png
      - name: Снимок в ветку ci-screens
        if: always()
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git checkout --orphan ci-screens; git rm -rfq --cached . ; git add -f screen.png screen3d.png || git add -f screen.png
          git commit -qm "screen ${GITHUB_SHA::7}"; git push -qf origin ci-screens
      - name: Логи
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml -f team/tynys/compose.yml logs --tail=200

name: tynys-e2e
# Запуск решения с нуля по README в окружении, близком к окружению судьи (Ubuntu 24.04).
permissions:
  contents: write
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Инструкция README
        run: |
          set -o pipefail
          { lscpu | grep '^CPU(s)'; free -g | head -2; lsb_release -d; docker --version; docker compose version; } | tee ci.log
          start=$(date +%s)
          sudo apt-get install -y make
          make tynys 2>&1 | tail -5 | tee -a ci.log
          echo "Время запуска по README: $(( $(date +%s) - start )) с" | tee -a ci.log
      - name: What-if на стенде (включить → след в двойниках → отменить)
        run: |
          set -o pipefail
          python3 team/tynys/scripts/whatif_check.py | tee -a ci.log
      - name: 3D без GPU (функции)
        if: always()
        env:
          TYNYS_MIN_FPS: '10'
        run: |
          set -o pipefail
          pip install playwright==1.64.0 && python -m playwright install --with-deps chromium
          python team/tynys/scripts/check3d.py http://127.0.0.1:8095/3d.html screen3d.png --mode functional --expect-source live 2>&1 | tee -a ci.log
      - name: Снимок пульта (материал для команды)
        if: always()
        continue-on-error: true
        run: python team/tynys/scripts/screenshot.py http://127.0.0.1:8095 screen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-scene-evidence
          path: |
            screen3d*.png
            screen3d.json
            ci.log
          if-no-files-found: ignore
      - name: Снимок в ветку ci-screens
        if: always()
        continue-on-error: true
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git checkout --orphan ci-screens; git rm -rfq --cached . ; git add -f screen.png screen3d.png ci.log || git add -f screen.png ci.log
          git commit -qm "screen ${GITHUB_SHA::7}"; git push -qf origin ci-screens
      - name: Логи
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml -f team/tynys/compose.yml logs --tail=200

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тыныс 3D · Актогай</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1118;color:#e6edf3;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#c{position:fixed;inset:0}
.hud{position:fixed;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
#top{top:14px;left:16px;right:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#top h1{margin:0;font-size:20px;background:rgba(14,22,32,.72);backdrop-filter:blur(8px);padding:6px 12px;border-radius:10px}#top h1 small{color:#9fb3c6;font-weight:400}
#mode{font-weight:800;font-size:18px;padding:5px 16px;border-radius:20px;letter-spacing:.06em;background:#223;transition:background .6s}
#mode.inhale{background:#1d5a3d;color:#9ff5c6;box-shadow:0 0 24px #2bd17e88}#mode.exhale{background:#5a3a1d;color:#ffcf9f;box-shadow:0 0 24px #e08a3a66}
#clock{margin-left:auto;color:#e6edf3;background:rgba(14,22,32,.72);padding:6px 12px;border-radius:10px}
.glass{background:rgba(14,22,32,.72);backdrop-filter:blur(8px);border:1px solid rgba(120,160,200,.22);border-radius:12px;padding:12px 14px}
#why{left:16px;bottom:16px;max-width:560px}
#why b{color:#8ff0bd}
#kpi{right:16px;top:64px;width:260px}
#kpi table{width:100%;border-collapse:collapse}#kpi td{padding:3px 0}#kpi td+td{text-align:right;font-weight:700}
#ctrl{right:16px;bottom:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:520px}
button,a.btn{background:rgba(32,48,65,.9);color:#e6edf3;border:1px solid #3d5a78;border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit;text-decoration:none}
button:hover,a.btn:hover{border-color:#4fd18b}
#caption{left:50%;top:18%;transform:translateX(-50%);font-size:26px;font-weight:700;text-align:center;max-width:820px;text-shadow:0 2px 12px #000;opacity:0;transition:opacity .8s}
#caption small{display:block;font-size:17px;font-weight:400;color:#cfe0ee;margin-top:6px}
.lbl{color:#fff;font-size:12px;background:rgba(10,16,24,.7);border:1px solid rgba(140,180,220,.3);padding:3px 7px;border-radius:6px;white-space:nowrap;text-align:center;line-height:1.25}
.lbl b{display:block;font-size:12px;color:#8ff0bd}
.mute{color:#9fb3c6}
@media(max-width:800px){#kpi{display:none}#why{max-width:calc(100% - 32px);bottom:70px}#caption{font-size:19px}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="top"><h1>Тыныс 3D <small>· рудник Актогай · живые данные из двойников OpenEgiz</small></h1><div id="mode">—</div><div id="clock">подключение к Ditto…</div></div>
<div class="hud glass" id="kpi"><table><tbody id="kt"></tbody></table></div>
<div class="hud glass" id="why"><div id="whyt">—</div></div>
<div class="hud" id="caption"></div>
<div class="hud" id="ctrl"><button id="tour">▶ Экскурсия</button><button id="reset">Камера на место</button><a class="btn" href="./">Схема и «что если» →</a></div>
<script type="module" src="scene3d.js"></script>
</body>
</html>
